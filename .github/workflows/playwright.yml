name: Playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null && curl -sf http://localhost:5173/ >/dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become ready"
          docker compose logs
          exit 1

      - name: Select PR tests
        id: select
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "Changed files:"
          printf '  %s\n' "${changed_files[@]}"

          selected="$(node scripts/select-tests.js "${changed_files[@]}")"
          echo "Selected: $selected"
          echo "specs=$selected" >> "$GITHUB_OUTPUT"

      - name: Run Playwright
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ steps.select.outputs.specs }}" == "__ALL__" ]]; then
            npx playwright test
          else
            npx playwright test ${{ steps.select.outputs.specs }}
          fi
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Stop app
        if: always()
        run: docker compose logs && docker compose down
